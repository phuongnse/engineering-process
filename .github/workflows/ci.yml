name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install -r engineering_process/requirements-build.txt ".[dev]"
          cd "$RUNNER_TEMP"
          python -m build --outdir "$RUNNER_TEMP/dist" "$GITHUB_WORKSPACE"

      - name: Install built wheel
        run: python -m pip install --force-reinstall "$RUNNER_TEMP"/dist/*.whl

      - name: Validate complete self-adoption candidate
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'automation/renovate/engineering-process')
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt

      - name: Validate publication metadata
        if: github.event_name == 'pull_request'
        run: |
          processctl publication validate-pr --title "$PR_TITLE" --branch "$PR_BRANCH" --state "$PR_STATE"
          processctl publication validate-range --project-root . --branch "$PR_BRANCH" --range "$PR_BASE_SHA..$PR_HEAD_SHA"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_STATE: ${{ github.event.pull_request.draft && 'draft' || 'ready' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Validate portable skills
        run: |
          cd "$RUNNER_TEMP"
          processctl digest
          processctl skills validate

      - name: Produce bounded supplemental verification evidence
        run: >-
          python verification/generate_ci_evidence.py
          --project-root "$GITHUB_WORKSPACE"
          --output-root "$RUNNER_TEMP/engineering-process-ci-evidence"
          --expected-checkpoint "$CI_CHECKPOINT"
          --comparison-base "$CI_COMPARISON_BASE"
          --producer-actor "github-actions"
          --producer-context "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB:$RUNNER_OS:python-${{ matrix.python-version }}"
          --provider "github-actions"
          --repository "$GITHUB_REPOSITORY"
          --event-name "$GITHUB_EVENT_NAME"
          --workflow-name "$GITHUB_WORKFLOW"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --workflow-sha "$CI_WORKFLOW_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --job "$GITHUB_JOB"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          --runner-os "$RUNNER_OS"
          --runner-arch "$RUNNER_ARCH"
          --triggered-by "$GITHUB_ACTOR"
        env:
          CI_CHECKPOINT: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}

      - name: Upload supplemental verification evidence
        id: upload-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-process-ci-evidence-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/engineering-process-ci-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false
