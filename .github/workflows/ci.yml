name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  policy-verification:
    name: Policy verification
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: phuongnse/renovate-ops/.github/workflows/policy-verification.yml@38d952b8c94604df10fadc48b6c830a144ea1137

  adopted-process:
    name: Adopted public process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Install exact adopted authority
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --refresh-package engineering-process
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt
      - name: Install exact producer dependencies for doctor
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --only-binary :all:
          -r engineering_process/requirements-runtime.txt
          -r engineering_process/requirements-dev.txt
          -r engineering_process/requirements-build.txt
      - name: Validate complete self-adoption
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt
      - name: Diagnose the adopted authority
        run: processctl doctor --project-root .
      - name: Validate actual pull request publication
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: .
          PUBLICATION_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUBLICATION_TITLE: ${{ github.event.pull_request.title }}
          PUBLICATION_BODY: ${{ github.event.pull_request.body }}
          PUBLICATION_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python verification/verify_publication.py --pull-request

  test:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - name: Classify candidate verification
        id: classify
        shell: bash
        env:
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_CHANGED: ${{ github.event.changes.base && 'true' || 'false' }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME:$PR_EVENT_ACTION:$PR_BASE_CHANGED" in
            push::*|pull_request:opened:*|pull_request:synchronize:*|pull_request:reopened:*|pull_request:ready_for_review:*|pull_request:edited:true)
              mode=full
              ;;
            pull_request:converted_to_draft:*|pull_request:edited:false)
              mode=retained
              ;;
            *)
              echo "unsupported verification event: $GITHUB_EVENT_NAME/$PR_EVENT_ACTION (base changed: $PR_BASE_CHANGED)" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.classify.outputs.mode == 'full'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.classify.outputs.mode == 'retained'
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and test dependencies
        if: steps.classify.outputs.mode == 'full'
        run: >-
          python -m pip install
          -r engineering_process/requirements-runtime.txt
          -r engineering_process/requirements-dev.txt
          -r engineering_process/requirements-build.txt
          --editable .
      - name: Test runtime and contracts
        if: steps.classify.outputs.mode == 'full'
        run: python verification/run_test_suite.py
      - name: Validate the complete skill graph
        if: steps.classify.outputs.mode == 'full'
        run: python processctl.py skills validate --root process_assets/skills
      - name: Validate release identity
        if: steps.classify.outputs.mode == 'full'
        run: python processctl.py release validate
      - name: Validate reviewed release contents
        if: steps.classify.outputs.mode == 'full'
        run: python verification/render_release_notes.py --check RELEASE_NOTES.md
      - name: Build and install the distribution
        if: steps.classify.outputs.mode == 'full' && matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python verification/verify_distribution.py
      - name: Verify retained code evidence for metadata-only update
        if: steps.classify.outputs.mode == 'retained'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API_RESPONSE_LIMIT = 256 * 1024
          MAX_ARTIFACT_CANDIDATES = 16

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["PR_HEAD"]
          base = os.environ["PR_BASE_SHA"]
          branch = os.environ["PR_BRANCH"]
          matrix_os = os.environ["MATRIX_OS"]
          matrix_python = os.environ["MATRIX_PYTHON"]
          token = os.environ["GH_TOKEN"]

          def read_response(url: str) -> bytes:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  data = response.read(API_RESPONSE_LIMIT + 1)
              if len(data) > API_RESPONSE_LIMIT:
                  raise SystemExit("provider evidence response exceeded its bound")
              return data

          def read_json(url: str) -> dict[str, object]:
              try:
                  value = json.loads(read_response(url).decode("utf-8"))
              except (OSError, UnicodeError, TypeError, ValueError) as error:
                  raise SystemExit("provider evidence response was unavailable or invalid") from error
              if not isinstance(value, dict):
                  raise SystemExit("provider evidence response was not an object")
              return value

          artifact_name = f"code-evidence-v1-{matrix_os}-{matrix_python}-{base}-{head}"
          artifact_query = urlencode({"name": artifact_name, "per_page": "100"})
          artifacts_payload = read_json(
              f"{api}/repos/{repository}/actions/artifacts?{artifact_query}"
          )
          artifacts = artifacts_payload.get("artifacts")
          if not isinstance(artifacts, list):
              raise SystemExit("provider artifact response was not a list")

          for artifact in artifacts[:MAX_ARTIFACT_CANDIDATES]:
              if not isinstance(artifact, dict):
                  continue
              if artifact.get("name") != artifact_name or artifact.get("expired") is not False:
                  continue
              if not isinstance(artifact.get("size_in_bytes"), int) or artifact["size_in_bytes"] > 8 * 1024:
                  continue
              artifact_run = artifact.get("workflow_run")
              if not isinstance(artifact_run, dict) or not isinstance(artifact_run.get("id"), int):
                  continue
              run_id = artifact_run["id"]
              if artifact_run.get("head_sha") != head or artifact_run.get("head_branch") != branch:
                  continue
              run = read_json(f"{api}/repos/{repository}/actions/runs/{run_id}")
              if (
                  run.get("id") != run_id
                  or run.get("path") != ".github/workflows/ci.yml"
                  or run.get("event") != "pull_request"
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
                  or run.get("head_sha") != head
                  or run.get("head_branch") != branch
              ):
                  continue
              print(f"Retained provider artifact {artifact.get('id')} from workflow run {run_id}")
              raise SystemExit(0)

          raise SystemExit(
              f"No successful current-base code assurance artifact exists for PR head {head}"
          )
          PY
      - name: Prepare code assurance artifact
        if: steps.classify.outputs.mode == 'full' && github.event_name == 'pull_request'
        env:
          CODE_EVIDENCE_FILE: ${{ runner.temp }}/code-evidence-boundary-${{ matrix.os }}-${{ matrix.python }}.txt
        shell: bash
        run: |
          set -euo pipefail
          printf 'code-assurance-v1\n' > "$CODE_EVIDENCE_FILE"
      - name: Publish code assurance artifact
        if: steps.classify.outputs.mode == 'full' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-evidence-v1-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/code-evidence-boundary-${{ matrix.os }}-${{ matrix.python }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90
