name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Validate release tag and source
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          document = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          expected_tag = "v" + document["project"]["version"]
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match project version {expected_tag!r}"
              )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", os.environ["GITHUB_SHA"], "origin/main"],
              check=True,
          )
          PY

      - name: Build distributions
        run: |
          python -m pip install -r engineering_process/requirements-dev.txt
          python -m build --outdir dist

      - name: Verify built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          processctl digest
          processctl skills validate
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_*.py'

      - name: Preserve verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/engineering-process/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
