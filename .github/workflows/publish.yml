name: Publish

on:
  repository_dispatch:
    types: [engineering-process-release-ready]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize exact publication event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attestation_digest: ${{ steps.event.outputs.attestation_digest }}
      commit: ${{ steps.event.outputs.commit }}
      tag: ${{ steps.event.outputs.tag }}
      version: ${{ steps.event.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Validate authenticated publication event
        id: event
        run: |
          python verification/validate_publish_event.py "$GITHUB_EVENT_PATH" \
            > "$RUNNER_TEMP/publication-event.json"
          cat "$RUNNER_TEMP/publication-event.json"
          {
            printf 'attestation_digest=%s\n' "$(jq -r .attestationDigest "$RUNNER_TEMP/publication-event.json")"
            printf 'commit=%s\n' "$(jq -r .commit "$RUNNER_TEMP/publication-event.json")"
            printf 'tag=%s\n' "$(jq -r .tag "$RUNNER_TEMP/publication-event.json")"
            printf 'version=%s\n' "$(jq -r .version "$RUNNER_TEMP/publication-event.json")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Revalidate immutable release assets
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.tag }}

      - name: Bind the tagged release checkpoint
        env:
          EXPECTED_CHECKPOINT: ${{ needs.authorize.outputs.commit }}
        run: |
          checkpoint="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$checkpoint" = "$EXPECTED_CHECKPOINT"
          printf 'CHECKPOINT=%s\n' "$checkpoint" >> "$GITHUB_ENV"

      - name: Check out the base-controlled release validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-controller

      - name: Keep controller code outside the release source fingerprint
        run: printf '/.release-controller/\n' >> .git/info/exclude

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"

      - name: Resolve release evidence identity
        id: identity
        run: |
          mode="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["provenance"]["mode"])')"
          evidence_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print(release["identity"]["receiptAsset"] or release["identity"]["authorizationAsset"])')"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'evidence_asset=%s\n' "$evidence_asset" >> "$GITHUB_OUTPUT"

      - name: Install exact public authority and release dependencies
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          python -m pip install --require-hashes \
            -r engineering_process/requirements-release.txt

      - name: Download immutable release evidence and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets/distributions"
          download_asset() {
            local tag="$1" pattern="$2" directory="$3" attempt
            mkdir -p "$directory"
            for attempt in 1 2 3 4; do
              if gh release download "$tag" \
                --pattern "$pattern" --dir "$directory"; then
                return 0
              fi
              rm -f "$directory/$pattern"
              if test "$attempt" -eq 4; then
                return 1
              fi
              sleep "$((attempt * 2))"
            done
          }
          attestation_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"]))')"
          download_asset "$RELEASE_TAG" "$EVIDENCE_ASSET" \
            "$RUNNER_TEMP/release-assets"
          download_asset "$RELEASE_TAG" "$attestation_asset" \
            "$RUNNER_TEMP/release-assets"
          python -c 'import json; print("\n".join(json.load(open("release.json", encoding="utf-8"))["identity"]["artifacts"]))' \
            > "$RUNNER_TEMP/release-assets/artifact-names.txt"
          {
            printf '%s\n' "$EVIDENCE_ASSET" "$attestation_asset"
            cat "$RUNNER_TEMP/release-assets/artifact-names.txt"
          } | LC_ALL=C sort > "$RUNNER_TEMP/release-assets/expected-release-assets.txt"
          while IFS= read -r artifact; do
            download_asset "$RELEASE_TAG" "$artifact" \
              "$RUNNER_TEMP/release-assets/distributions"
          done < "$RUNNER_TEMP/release-assets/artifact-names.txt"
          printf 'EVIDENCE_PATH=%s\n' \
            "$RUNNER_TEMP/release-assets/$EVIDENCE_ASSET" >> "$GITHUB_ENV"
          printf 'ATTESTATION_PATH=%s\n' \
            "$RUNNER_TEMP/release-assets/$attestation_asset" >> "$GITHUB_ENV"

      - name: Validate immutable release identity and artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ATTESTATION_DIGEST: ${{ needs.authorize.outputs.attestation_digest }}
          RELEASE_NAME: ${{ needs.authorize.outputs.tag }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          MODE: ${{ steps.identity.outputs.mode }}
        run: |
          controller=(
            "$RUNNER_TEMP/process-authority/bin/python"
            "$GITHUB_WORKSPACE/.release-controller/processctl.py"
          )
          gh release verify "$RELEASE_TAG"
          actual_attestation_digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$(basename "$ATTESTATION_PATH")\") | .digest")"
          test "$actual_attestation_digest" = "$EXPECTED_ATTESTATION_DIGEST"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/release-assets/actual-release-assets.txt"
          cmp "$RUNNER_TEMP/release-assets/expected-release-assets.txt" \
            "$RUNNER_TEMP/release-assets/actual-release-assets.txt"
          gh release verify-asset "$RELEASE_TAG" "$EVIDENCE_PATH"
          gh release verify-asset "$RELEASE_TAG" "$ATTESTATION_PATH"
          while IFS= read -r artifact; do
            gh release verify-asset "$RELEASE_TAG" \
              "$RUNNER_TEMP/release-assets/distributions/$artifact"
          done < "$RUNNER_TEMP/release-assets/artifact-names.txt"
          evidence_args=()
          if test "$MODE" = governed; then
            "${controller[@]}" evidence validate \
              "$EVIDENCE_PATH" --json
            evidence_args+=(--receipt "$EVIDENCE_PATH")
          else
            "${controller[@]}" evidence validate-bootstrap \
              "$EVIDENCE_PATH" --json
            evidence_args+=(--authorization "$EVIDENCE_PATH")
          fi
          reviewed_sha="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checkpoint"])' "$EVIDENCE_PATH")"
          printf '%s' "$reviewed_sha" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin "$reviewed_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$reviewed_sha"
          git cat-file -e "$reviewed_sha^{commit}"
          "${controller[@]}" publication validate-release \
            --project-root . \
            --tag "$RELEASE_TAG" \
            --release-name "$RELEASE_NAME" \
            --commit "$CHECKPOINT" \
            --main-ref origin/main \
            "${evidence_args[@]}"
          "${controller[@]}" publication validate-artifacts \
            --project-root . \
            --artifacts "$RUNNER_TEMP/release-assets/distributions" \
            --attestation "$ATTESTATION_PATH" \
            --commit "$CHECKPOINT" \
            "${evidence_args[@]}"

      - name: Verify prepared wheel
        run: |
          python -m pip install --force-reinstall \
            --no-deps \
            "$RUNNER_TEMP"/release-assets/distributions/*.whl
          cd "$RUNNER_TEMP"
          processctl digest
          processctl skills validate
          python \
            "$GITHUB_WORKSPACE/.release-controller/verification/verify_installed_distribution.py" \
            --source-root "$GITHUB_WORKSPACE"

  pypi:
    name: Publish to PyPI
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/engineering-process/
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.tag }}

      - name: Bind the tagged release checkpoint
        env:
          EXPECTED_CHECKPOINT: ${{ needs.authorize.outputs.commit }}
        run: |
          checkpoint="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$checkpoint" = "$EXPECTED_CHECKPOINT"
          printf 'CHECKPOINT=%s\n' "$checkpoint" >> "$GITHUB_ENV"

      - name: Check out the base-controlled release validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-controller

      - name: Keep controller code outside the release source fingerprint
        run: printf '/.release-controller/\n' >> .git/info/exclude

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"

      - name: Resolve release evidence identity
        id: identity
        run: |
          mode="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["provenance"]["mode"])')"
          evidence_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print(release["identity"]["receiptAsset"] or release["identity"]["authorizationAsset"])')"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'evidence_asset=%s\n' "$evidence_asset" >> "$GITHUB_OUTPUT"

      - name: Install exact public authority and release dependencies
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          python -m pip install --require-hashes \
            -r engineering_process/requirements-release.txt

      - name: Download immutable release evidence and distributions
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets/distributions"
          download_asset() {
            local tag="$1" pattern="$2" directory="$3" attempt
            mkdir -p "$directory"
            for attempt in 1 2 3 4; do
              if gh release download "$tag" \
                --pattern "$pattern" --dir "$directory"; then
                return 0
              fi
              rm -f "$directory/$pattern"
              if test "$attempt" -eq 4; then
                return 1
              fi
              sleep "$((attempt * 2))"
            done
          }
          attestation_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"]))')"
          download_asset "$RELEASE_TAG" "$EVIDENCE_ASSET" \
            "$RUNNER_TEMP/release-assets"
          download_asset "$RELEASE_TAG" "$attestation_asset" \
            "$RUNNER_TEMP/release-assets"
          python -c 'import json; print("\n".join(json.load(open("release.json", encoding="utf-8"))["identity"]["artifacts"]))' \
            > "$RUNNER_TEMP/release-assets/artifact-names.txt"
          {
            printf '%s\n' "$EVIDENCE_ASSET" "$attestation_asset"
            cat "$RUNNER_TEMP/release-assets/artifact-names.txt"
          } | LC_ALL=C sort > "$RUNNER_TEMP/release-assets/expected-release-assets.txt"
          while IFS= read -r artifact; do
            download_asset "$RELEASE_TAG" "$artifact" \
              "$RUNNER_TEMP/release-assets/distributions"
          done < "$RUNNER_TEMP/release-assets/artifact-names.txt"
          printf 'EVIDENCE_PATH=%s\n' \
            "$RUNNER_TEMP/release-assets/$EVIDENCE_ASSET" >> "$GITHUB_ENV"
          printf 'ATTESTATION_PATH=%s\n' \
            "$RUNNER_TEMP/release-assets/$attestation_asset" >> "$GITHUB_ENV"

      - name: Revalidate immutable release immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ATTESTATION_DIGEST: ${{ needs.authorize.outputs.attestation_digest }}
          RELEASE_NAME: ${{ needs.authorize.outputs.tag }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          MODE: ${{ steps.identity.outputs.mode }}
        run: |
          controller=(
            "$RUNNER_TEMP/process-authority/bin/python"
            "$GITHUB_WORKSPACE/.release-controller/processctl.py"
          )
          gh release verify "$RELEASE_TAG"
          actual_attestation_digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$(basename "$ATTESTATION_PATH")\") | .digest")"
          test "$actual_attestation_digest" = "$EXPECTED_ATTESTATION_DIGEST"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/release-assets/actual-release-assets.txt"
          cmp "$RUNNER_TEMP/release-assets/expected-release-assets.txt" \
            "$RUNNER_TEMP/release-assets/actual-release-assets.txt"
          gh release verify-asset "$RELEASE_TAG" "$EVIDENCE_PATH"
          gh release verify-asset "$RELEASE_TAG" "$ATTESTATION_PATH"
          while IFS= read -r artifact; do
            gh release verify-asset "$RELEASE_TAG" \
              "$RUNNER_TEMP/release-assets/distributions/$artifact"
          done < "$RUNNER_TEMP/release-assets/artifact-names.txt"
          evidence_args=()
          if test "$MODE" = governed; then
            "${controller[@]}" evidence validate \
              "$EVIDENCE_PATH" --json
            evidence_args+=(--receipt "$EVIDENCE_PATH")
          else
            "${controller[@]}" evidence validate-bootstrap \
              "$EVIDENCE_PATH" --json
            evidence_args+=(--authorization "$EVIDENCE_PATH")
          fi
          reviewed_sha="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checkpoint"])' "$EVIDENCE_PATH")"
          printf '%s' "$reviewed_sha" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin "$reviewed_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$reviewed_sha"
          git cat-file -e "$reviewed_sha^{commit}"
          "${controller[@]}" publication validate-release \
            --project-root . \
            --tag "$RELEASE_TAG" \
            --release-name "$RELEASE_NAME" \
            --commit "$CHECKPOINT" \
            --main-ref origin/main \
            "${evidence_args[@]}"
          "${controller[@]}" publication validate-artifacts \
            --project-root . \
            --artifacts "$RUNNER_TEMP/release-assets/distributions" \
            --attestation "$ATTESTATION_PATH" \
            --commit "$CHECKPOINT" \
            "${evidence_args[@]}"

      - name: Resolve exact PyPI publication state
        id: registry
        run: |
          python \
            .release-controller/verification/check_pypi_publication.py \
            --project-root "$GITHUB_WORKSPACE" \
            --attestation "$ATTESTATION_PATH" \
            > "$RUNNER_TEMP/pypi-state.json"
          cat "$RUNNER_TEMP/pypi-state.json"
          publish_required="$(jq -r .publishRequired "$RUNNER_TEMP/pypi-state.json")"
          test "$publish_required" = true -o "$publish_required" = false
          printf 'publish_required=%s\n' "$publish_required" >> "$GITHUB_OUTPUT"

      - name: Publish distributions with attestations
        if: steps.registry.outputs.publish_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/release-assets/distributions/

      - name: Require exact PyPI publication
        run: >-
          python
          .release-controller/verification/check_pypi_publication.py
          --project-root "$GITHUB_WORKSPACE"
          --attestation "$ATTESTATION_PATH"
          --require-published
          --wait-seconds 120

  adoption:
    name: Dispatch exact process adoption
    needs: [authorize, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.tag }}

      - name: Resolve bounded adoption event identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          package="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["identity"]["package"])')"
          version="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          attestation="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"]))')"
          digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$attestation\") | .digest")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          {
            printf 'attestation_digest=%s\n' "$digest"
            printf 'package=%s\n' "$package"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create short-lived Renovate event token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: renovate-ops
          permission-contents: write
          permission-metadata: read

      - name: Dispatch authenticated adoption event
        env:
          ATTESTATION_DIGEST: ${{ steps.identity.outputs.attestation_digest }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ steps.identity.outputs.package }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          jq -n \
            --arg attestationDigest "$ATTESTATION_DIGEST" \
            --arg package "$PACKAGE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" \
            '{event_type: "engineering-process-published", client_payload: {attestationDigest: $attestationDigest, package: $package, repository: $repository, tag: $tag, version: $version}}' \
            > "$RUNNER_TEMP/adoption-event.json"
          gh api --method POST \
            repos/phuongnse/renovate-ops/dispatches \
            --input "$RUNNER_TEMP/adoption-event.json"
