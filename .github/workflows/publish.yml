name: Publish release

on:
  push:
    branches: [main]
    paths:
      - release.json
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-ancestry release commit to resume
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_SOURCE_SHA: ${{ inputs.release_sha || github.sha }}

jobs:
  metadata:
    name: Authorize release
    runs-on: ubuntu-latest
    outputs:
      dispatch: ${{ steps.release.outputs.dispatch }}
      publish: ${{ steps.release.outputs.publish }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main
      - id: release
        name: Authorize release source from trusted main
        run: |
          if [[ ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source must be a full commit SHA" >&2
            exit 1
          fi
          git fetch origin main
          git cat-file -e "$RELEASE_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" origin/main
          for file in engineering_process/__init__.py pyproject.toml release.json; do
            if ! git diff --name-only "$RELEASE_SOURCE_SHA^" "$RELEASE_SOURCE_SHA" -- "$file" | grep -Fx "$file"; then
              echo "release source did not change $file" >&2
              exit 1
            fi
          done
          version="$(git show "$RELEASE_SOURCE_SHA:release.json" | jq -er \
            '.version | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))')"
          git show "$RELEASE_SOURCE_SHA:engineering_process/__init__.py" \
            | grep -Fx "VERSION = \"$version\""
          git show "$RELEASE_SOURCE_SHA:pyproject.toml" \
            | grep -Fx "version = \"$version\""
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            if [ "$(git rev-list -n 1 "$tag")" != "$RELEASE_SOURCE_SHA" ]; then
              echo "tag $tag points to a different commit" >&2
              exit 1
            fi
          fi
          {
            echo "source_sha=$RELEASE_SOURCE_SHA"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=true"
            echo "dispatch=true"
          } >> "$GITHUB_OUTPUT"
      - name: Check out authorized release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r engineering_process/requirements-runtime.txt --editable .
      - run: python processctl.py release validate --tag "${{ steps.release.outputs.tag }}"

  publish:
    name: Publish immutable release
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install exact build and test dependencies
        run: >-
          python -m pip install
          -r engineering_process/requirements-runtime.txt
          -r engineering_process/requirements-dev.txt
          -r engineering_process/requirements-build.txt
          --editable .
      - run: python verification/run_test_suite.py
      - run: python processctl.py skills validate --root process_assets/skills
      - run: python processctl.py release validate --tag "${{ needs.metadata.outputs.tag }}"
      - name: Derive reproducible build timestamp
        id: source
        run: >-
          echo "epoch=$(git show -s --format=%ct
          '${{ needs.metadata.outputs.source_sha }}')" >> "$GITHUB_OUTPUT"
      - name: Build reproducible release files
        env:
          PYTHONHASHSEED: "0"
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
          TZ: UTC
        run: |
          python -m build --no-isolation
          python verification/normalize_sdist.py \
            dist/*.tar.gz \
            "$SOURCE_DATE_EPOCH"
      - name: Publish immutable files to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
      - name: Verify PyPI exposes the exact built hashes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import urlopen

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.is_file()
              and (path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          }
          url = f"https://pypi.org/pypi/engineering-process/{os.environ['RELEASE_VERSION']}/json"
          for attempt in range(12):
              try:
                  with urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  actual = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                  }
                  if actual == expected:
                      break
              except Exception:
                  if attempt == 11:
                      raise
              if attempt == 11:
                  raise RuntimeError(f"PyPI files differ: expected {expected}, got {actual}")
              time.sleep(10)
          PY
      - name: Create short-lived release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: engineering-process
          permission-contents: write
          permission-metadata: read
      - name: Create immutable GitHub release and tag
        env:
          EXISTING_RELEASE_ROOT: ${{ runner.temp }}/existing-release
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="${{ needs.metadata.outputs.source_sha }}"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          mkdir "$RUNNER_TEMP/existing-release"
          gh release download "$RELEASE_TAG" \
            --dir "$RUNNER_TEMP/existing-release" || true
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          existing = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in Path(os.environ["EXISTING_RELEASE_ROOT"]).iterdir()}
          conflicts = {name for name in existing if expected.get(name) != existing[name]}
          if conflicts:
              raise RuntimeError(f"GitHub release has conflicting assets: {sorted(conflicts)}")
          PY
          for file in dist/*.whl dist/*.tar.gz; do
            name="$(basename "$file")"
            if [ ! -f "$RUNNER_TEMP/existing-release/$name" ]; then
              if [ "$release_is_draft" != "true" ]; then
                echo "published GitHub release is missing $name" >&2
                exit 1
              fi
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          rm -rf "$RUNNER_TEMP/existing-release"
          mkdir "$RUNNER_TEMP/existing-release"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/existing-release"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          actual = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in Path(os.environ["EXISTING_RELEASE_ROOT"]).iterdir()}
          if actual != expected:
              raise RuntimeError(f"GitHub release assets differ: expected {expected}, got {actual}")
          PY
          gh release edit "$RELEASE_TAG" --draft=false

  dispatch-adoption:
    name: Dispatch consumer adoption
    needs: [metadata, publish]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.dispatch == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download the immutable release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/distribution"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/distribution"
      - name: Bind the published distribution
        id: distribution
        env:
          DISTRIBUTION_ROOT: ${{ runner.temp }}/distribution
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          files = [path for path in Path(os.environ["DISTRIBUTION_ROOT"]).iterdir() if path.is_file()]
          actual = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          url = f"https://pypi.org/pypi/engineering-process/{os.environ['RELEASE_VERSION']}/json"
          with urlopen(url, timeout=20) as response:
              payload = json.load(response)
          expected = {item["filename"]: item["digests"]["sha256"] for item in payload["urls"]}
          if actual != expected:
              raise RuntimeError(f"GitHub and PyPI release files differ: {actual} != {expected}")
          digest = hashlib.sha256()
          for path in sorted(files):
              name = path.name.encode()
              content = path.read_bytes()
              digest.update(len(name).to_bytes(4, "big"))
              digest.update(name)
              digest.update(hashlib.sha256(content).digest())
          print(f"digest=sha256:{digest.hexdigest()}")
          PY
      - name: Create short-lived Renovate event token
        id: renovate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: renovate-ops
          permission-contents: write
          permission-metadata: read
      - name: Trigger consumer adoption scans
        env:
          DISTRIBUTION_DIGEST: ${{ steps.distribution.outputs.digest }}
          GH_TOKEN: ${{ steps.renovate-token.outputs.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          jq -n \
            --arg distributionDigest "$DISTRIBUTION_DIGEST" \
            --arg package "engineering-process" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            '{event_type: "engineering-process-published", client_payload: {distributionDigest: $distributionDigest, package: $package, repository: $repository, tag: $tag, version: $version}}' \
            > "$RUNNER_TEMP/adoption-event.json"
          gh api --method POST \
            repos/phuongnse/renovate-ops/dispatches \
            --input "$RUNNER_TEMP/adoption-event.json"
