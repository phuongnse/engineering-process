name: Release Authorization

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: release-authorization-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Bind independent verification to the exact candidate
    if: >-
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/release/next' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve and validate the internal Release PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if test -z "$PR_NUMBER"; then
            owner="${GITHUB_REPOSITORY%%/*}"
            gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$HEAD_BRANCH" \
              > "$RUNNER_TEMP/release-pulls.json"
            test "$(jq length "$RUNNER_TEMP/release-pulls.json")" = 1
            PR_NUMBER="$(jq -r '.[0].number' "$RUNNER_TEMP/release-pulls.json")"
          fi
          test -n "$PR_NUMBER"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)" = "automation/release/next"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref)" = main
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
            --jq 'map(select(.context == "release-authorization"))[0].state // empty')"
          if test "$state" = success; then
            echo "already_authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_authorized=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Mark release authorization pending
        if: steps.resolve.outputs.already_authorized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
          -f state=pending
          -f context=release-authorization
          -f description='Binding independent automated verification'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.resolve.outputs.already_authorized != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.resolve.outputs.already_authorized != 'true'
        with:
          python-version: "3.14"

      - name: Install the exact public N-1 authority
        if: steps.resolve.outputs.already_authorized != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            -r engineering_process/requirements-runtime.txt \
            -r engineering_process/requirements-dev.txt \
            -r engineering_process/requirements-build.txt
          printf '%s\n' "$RUNNER_TEMP/process-authority/bin" >> "$GITHUB_PATH"

      - name: Restore and validate independent verification evidence
        if: steps.resolve.outputs.already_authorized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/independent-review"
          gh run download "$CI_RUN_ID" \
            --name "independent-review-$PR_NUMBER-$HEAD_SHA" \
            --dir "$RUNNER_TEMP/independent-review"
          python -c '
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "independent-review" / "report.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed"
          assert report["governanceMode"] == "single-maintainer"
          assert report["verificationKind"] == "independent-automated"
          assert report["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert report["headSha"] == os.environ["HEAD_SHA"]
          assert report["verifierRepository"] == "phuongnse/renovate-ops"
          assert report["verifierSha"] == "abe046318b3e1f7a2801faaaf891a6dd05fd6822"
          '

      - name: Restore the successful exact-head candidate lifecycle
        if: steps.resolve.outputs.already_authorized != 'true'
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          change_id="$(python -c 'import json; print(json.load(open(".release/change.json", encoding="utf-8"))["id"])')"
          run_id=""
          for _attempt in $(seq 1 120); do
            run_id="$(gh run list --workflow release-candidate.yml --commit "$HEAD_SHA" \
              --status success --limit 20 --json databaseId,headSha \
              --jq 'map(select(.headSha == env.HEAD_SHA))[0].databaseId // empty')"
            test -z "$run_id" || break
            sleep 15
          done
          test -n "$run_id"
          mkdir -p ".process/runs/$change_id"
          gh run download "$run_id" --name "release-candidate-$HEAD_SHA" \
            --dir ".process/runs/$change_id"
          printf 'change_id=%s\n' "$change_id" >> "$GITHUB_OUTPUT"
          mode="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["provenance"]["mode"])')"
          evidence_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print(release["identity"]["receiptAsset"] or release["identity"]["authorizationAsset"])')"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'evidence_asset=%s\n' "$evidence_asset" >> "$GITHUB_OUTPUT"

      - name: Finalize the independently verified lifecycle
        if: steps.resolve.outputs.already_authorized != 'true'
        env:
          CHANGE_ID: ${{ steps.identity.outputs.change_id }}
          CONTEXT_ID: release-pr-${{ steps.resolve.outputs.pr_number }}-${{ github.event.workflow_run.head_sha }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
          INDEPENDENT_EVIDENCE: ${{ runner.temp }}/independent-review/report.json
          MODE: ${{ steps.identity.outputs.mode }}
        run: |
          processctl change status --change-id "$CHANGE_ID"
          python verification/prepare_release_review.py \
            --change-id "$CHANGE_ID" \
            --independent-evidence "$INDEPENDENT_EVIDENCE" \
            --output "$RUNNER_TEMP/release-review.json"
          processctl change review submit \
            --change-id "$CHANGE_ID" --report "$RUNNER_TEMP/release-review.json"
          processctl change finish \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID"
          mkdir -p "$RUNNER_TEMP/release-authorization"
          if test "$MODE" = governed; then
            processctl evidence export --change-id "$CHANGE_ID" \
              --output "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            processctl evidence validate \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
          else
            python processctl.py evidence export-bootstrap --change-id "$CHANGE_ID" \
              --output "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            python processctl.py evidence validate-bootstrap \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
          fi

      - name: Preserve release authorization evidence
        if: steps.resolve.outputs.already_authorized != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-authorization-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-authorization/${{ steps.identity.outputs.evidence_asset }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false

      - name: Mark the verified Release PR ready
        if: steps.resolve.outputs.already_authorized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python processctl.py publication release-pr-body \
            --state approved --output "$RUNNER_TEMP/release-pr.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/release-pr.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=release-authorization \
            -f description='Exact candidate independently verified; merge authorizes release'
          if test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = true; then
            gh pr ready "$PR_NUMBER"
          fi

      - name: Fail the release authorization status
        if: ${{ failure() && steps.resolve.outputs.already_authorized != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
          -f state=failure
          -f context=release-authorization
          -f description='Release authorization evidence failed'
