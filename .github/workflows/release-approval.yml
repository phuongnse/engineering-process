name: Publish completed Release PR

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Run containing the exact verified unpublished candidate
        required: true
        type: string
      comparison_base:
        description: Exact protected-main comparison base
        required: true
        type: string
      release_head_sha:
        description: Exact completed candidate checkpoint
        required: true
        type: string
      completion_evidence_gzip_base64:
        description: Gzip/base64 external completion evidence from the consumer host
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-publication-${{ inputs.release_head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate completion before publishing source or PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate bounded publication identity
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          EVIDENCE_BASE64: ${{ inputs.completion_evidence_gzip_base64 }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          printf '%s' "$VERIFIED_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$EVIDENCE_BASE64"
          test "${#EVIDENCE_BASE64}" -le 60000

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.comparison_base }}

      - name: Restore the exact unpublished candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-candidate"
          gh run download "$VERIFIED_RUN_ID" \
            --name "verified-release-candidate-$HEAD_SHA" \
            --dir "$RUNNER_TEMP/verified-candidate"
          test "$(jq -r .headSha "$RUNNER_TEMP/verified-candidate/candidate.json")" = "$HEAD_SHA"
          test "$(jq -r .baseSha "$RUNNER_TEMP/verified-candidate/candidate.json")" = "${{ inputs.comparison_base }}"
          git fetch "$RUNNER_TEMP/verified-candidate/source.bundle" "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install exact public authority and candidate dependencies
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            -r engineering_process/requirements-runtime.txt \
            -r engineering_process/requirements-dev.txt \
            -r engineering_process/requirements-build.txt
          printf '%s\n' "$RUNNER_TEMP/process-authority/bin" >> "$GITHUB_PATH"

      - name: Decode and validate host completion evidence
        id: evidence
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          EVIDENCE_BASE64: ${{ inputs.completion_evidence_gzip_base64 }}
        run: |
          printf '%s' "$EVIDENCE_BASE64" > "$RUNNER_TEMP/completion-evidence.txt"
          "$RUNNER_TEMP/process-authority/bin/python" \
            verification/decode_completion_evidence.py \
            --input "$RUNNER_TEMP/completion-evidence.txt" \
            --output "$RUNNER_TEMP/completion-evidence.json"
          mode="$(jq -r .provenance.mode release.json)"
          if test "$mode" = governed; then
            processctl evidence validate "$RUNNER_TEMP/completion-evidence.json" --json \
              > "$RUNNER_TEMP/completion-summary.json"
            evidence_kind=receipt
          else
            "$RUNNER_TEMP/process-authority/bin/python" processctl.py \
              evidence validate-bootstrap "$RUNNER_TEMP/completion-evidence.json" --json \
              > "$RUNNER_TEMP/completion-summary.json"
            evidence_kind=bootstrap-authorization
          fi
          "$RUNNER_TEMP/process-authority/bin/python" \
            verification/validate_release_completion_identity.py \
            --summary "$RUNNER_TEMP/completion-summary.json" \
            --release-change .release/change.json \
            --process-lock .process/process.lock \
            --expected-checkpoint "$HEAD_SHA" \
            > "$RUNNER_TEMP/completion-identity.json"
          evidence_asset="$(jq -r '.identity.receiptAsset // .identity.authorizationAsset' release.json)"
          test -n "$evidence_asset"
          mkdir -p "$RUNNER_TEMP/completion"
          cp "$RUNNER_TEMP/completion-evidence.json" "$RUNNER_TEMP/completion/$evidence_asset"
          printf 'evidence_asset=%s\n' "$evidence_asset" >> "$GITHUB_OUTPUT"
          printf 'evidence_kind=%s\n' "$evidence_kind" >> "$GITHUB_OUTPUT"

      - name: Validate exact completed source and publication metadata
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          RELEASE_BRANCH: automation/release/next
        run: |
          version="$(jq -r .version release.json)"
          title="chore(release): prepare v$version"
          processctl publication release-pr-body \
            --state approved --output "$RUNNER_TEMP/release-pr.md"
          evidence_sha256="$(sha256sum "$RUNNER_TEMP/completion-evidence.json" | cut -d ' ' -f1)"
          cat >> "$RUNNER_TEMP/release-pr.md" <<EOF

          ## Project-specific requirements

          - [x] **Project-specific: Completion evidence** — SHA-256 \`$evidence_sha256\` binds the exact host authorization. [status: satisfied]
          EOF
          processctl publication validate-pr \
            --title "$title" --body-file "$RUNNER_TEMP/release-pr.md" \
            --branch "$RELEASE_BRANCH" --state ready
          "$RUNNER_TEMP/process-authority/bin/python" processctl.py \
            publication validate-evidence-source --project-root . \
            --evidence "$RUNNER_TEMP/completion-evidence.json" \
            --evidence-kind "${{ steps.evidence.outputs.evidence_kind }}" \
            --commit "$HEAD_SHA" --title "$title" \
            --branch "$RELEASE_BRANCH" --body-file "$RUNNER_TEMP/release-pr.md"
          processctl publication validate-range \
            --project-root . --branch "$RELEASE_BRANCH" \
            --range "$BASE_SHA..$HEAD_SHA"

      - name: Preserve completion evidence before source publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-completion-${{ inputs.release_head_sha }}
          path: ${{ runner.temp }}/completion/${{ steps.evidence.outputs.evidence_asset }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Create short-lived source publication token
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: engineering-process
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Publish exact completed source and enable protected auto-merge
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          RELEASE_BRANCH: automation/release/next
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          version="$(jq -r .version release.json)"
          title="chore(release): prepare v$version"
          gh pr list --state all --head "$RELEASE_BRANCH" --base main --limit 20 \
            --json baseRefName,body,headRefName,headRefOid,isDraft,mergedAt,number,state,title \
            > "$RUNNER_TEMP/open-release-prs.json"
          python verification/reconcile_completed_release.py \
            --open-pull-requests "$RUNNER_TEMP/open-release-prs.json" \
            --remote-head-sha "$remote_sha" \
            --expected-head-sha "$HEAD_SHA" \
            --expected-base main \
            --expected-branch "$RELEASE_BRANCH" \
            --expected-title "$title" \
            --expected-body "$RUNNER_TEMP/release-pr.md" \
            > "$RUNNER_TEMP/release-reconciliation.json"
          action="$(jq -er .action "$RUNNER_TEMP/release-reconciliation.json")"
          if test "$action" = merged; then
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          git show "$BASE_SHA:verification/validate_protected_automation_policy.py" \
            > "$RUNNER_TEMP/validate-protected-automation-policy.py"
          git show "$BASE_SHA:.process/automation.json" \
            > "$RUNNER_TEMP/protected-base-automation.json"
          cmp "$RUNNER_TEMP/protected-base-automation.json" .process/automation.json
          python "$RUNNER_TEMP/validate-protected-automation-policy.py" \
            --policy "$RUNNER_TEMP/protected-base-automation.json" \
            > "$RUNNER_TEMP/protected-automation-summary.json"
          merge_method="$(jq -er .mergeMethod \
            "$RUNNER_TEMP/protected-automation-summary.json")"
          if test "$action" = existing; then
            pr_number="$(jq -er .pullRequestNumber \
              "$RUNNER_TEMP/release-reconciliation.json")"
          else
            if test "$action" = publish-and-create; then
              git push origin "$HEAD_SHA:refs/heads/$RELEASE_BRANCH"
            fi
            gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/release-pr.md"
            pr_number="$(gh pr view "$RELEASE_BRANCH" --json number --jq .number)"
          fi
          printf '%s' "$pr_number" | grep -Eq '^[1-9][0-9]*$'
          test "$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --auto "--$merge_method" --match-head-commit "$HEAD_SHA"
