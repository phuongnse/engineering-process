name: Complete review and publish Release PR

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Run containing the exact verified candidate lifecycle
        required: true
        type: string
      comparison_base:
        description: Exact protected-main comparison base
        required: true
        type: string
      release_head_sha:
        description: Exact reviewed candidate checkpoint
        required: true
        type: string
      reviewer_actor:
        description: Consumer-host selected stable reviewer actor
        required: true
        type: string
      reviewer_context:
        description: Fresh isolated reviewer context
        required: true
        type: string
      reviewer_kind:
        description: Reviewer kind, agent or human
        required: true
        type: string
      review_method:
        description: Isolation method
        required: true
        type: string
      attested_by:
        description: Host or organization attesting reviewer isolation
        required: true
        type: string
      attestation_evidence:
        description: Bounded evidence for reviewer isolation
        required: true
        type: string
      review_report_base64:
        description: Base64-encoded exact schema review report
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-review-${{ inputs.release_head_sha }}
  cancel-in-progress: false

jobs:
  complete-and-publish:
    name: Complete lifecycle before publishing source or PR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate bounded callback identity
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          REVIEWER_KIND: ${{ inputs.reviewer_kind }}
          REVIEW_METHOD: ${{ inputs.review_method }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          printf '%s' "$VERIFIED_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$REVIEWER_KIND" = agent || test "$REVIEWER_KIND" = human
          test "$REVIEW_METHOD" = isolated-context || test "$REVIEW_METHOD" = separate-person

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.comparison_base }}

      - name: Restore the exact verified candidate and lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-candidate"
          gh run download "$VERIFIED_RUN_ID" \
            --name "verified-release-candidate-$HEAD_SHA" \
            --dir "$RUNNER_TEMP/verified-candidate"
          test "$(jq -r .headSha "$RUNNER_TEMP/verified-candidate/candidate.json")" = "$HEAD_SHA"
          test "$(jq -r .baseSha "$RUNNER_TEMP/verified-candidate/candidate.json")" = "${{ inputs.comparison_base }}"
          git fetch "$RUNNER_TEMP/verified-candidate/source.bundle" "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          change_id="$(jq -r .id .release/change.json)"
          mkdir -p ".process/runs/$change_id"
          cp -R "$RUNNER_TEMP/verified-candidate/lifecycle/." ".process/runs/$change_id/"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install the exact public N-1 authority and project dependencies
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            -r engineering_process/requirements-runtime.txt \
            -r engineering_process/requirements-dev.txt \
            -r engineering_process/requirements-build.txt
          printf '%s\n' "$RUNNER_TEMP/process-authority/bin" >> "$GITHUB_PATH"

      - name: Register and submit the consumer-host semantic review
        id: lifecycle
        env:
          ATTESTATION_EVIDENCE: ${{ inputs.attestation_evidence }}
          ATTESTED_BY: ${{ inputs.attested_by }}
          REPORT_BASE64: ${{ inputs.review_report_base64 }}
          REVIEWER_ACTOR: ${{ inputs.reviewer_actor }}
          REVIEWER_CONTEXT: ${{ inputs.reviewer_context }}
          REVIEWER_KIND: ${{ inputs.reviewer_kind }}
          REVIEW_METHOD: ${{ inputs.review_method }}
        run: |
          change_id="$(jq -r .id .release/change.json)"
          processctl change review start \
            --actor "$REVIEWER_ACTOR" --context "$REVIEWER_CONTEXT" \
            --actor-kind "$REVIEWER_KIND" --change-id "$change_id" \
            --method "$REVIEW_METHOD" --attested-by "$ATTESTED_BY" \
            --attestation-evidence "$ATTESTATION_EVIDENCE"
          printf '%s' "$REPORT_BASE64" | base64 --decode > "$RUNNER_TEMP/host-review.json"
          processctl contract validate --kind review "$RUNNER_TEMP/host-review.json"
          "$RUNNER_TEMP/process-authority/bin/python" verification/prepare_release_review.py \
            --change-id "$change_id" \
            --review-report "$RUNNER_TEMP/host-review.json" \
            --output "$RUNNER_TEMP/release-review.json"
          processctl change review submit \
            --change-id "$change_id" --report "$RUNNER_TEMP/release-review.json"
          test "$(processctl change status --change-id "$change_id" --json | jq -r .phase)" = approved
          processctl change finish \
            --actor github-release-bot \
            --context "release-publication-${{ inputs.release_head_sha }}" \
            --actor-kind agent --change-id "$change_id"
          printf 'change_id=%s\n' "$change_id" >> "$GITHUB_OUTPUT"

      - name: Export completed lifecycle evidence
        id: evidence
        env:
          CHANGE_ID: ${{ steps.lifecycle.outputs.change_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/completion"
          mode="$(jq -r .provenance.mode release.json)"
          evidence_asset="$(jq -r '.identity.receiptAsset // .identity.authorizationAsset' release.json)"
          test -n "$evidence_asset"
          if test "$mode" = governed; then
            processctl evidence export --change-id "$CHANGE_ID" \
              --output "$RUNNER_TEMP/completion/$evidence_asset"
            processctl evidence validate "$RUNNER_TEMP/completion/$evidence_asset"
          else
            "$RUNNER_TEMP/process-authority/bin/python" processctl.py \
              evidence export-bootstrap --change-id "$CHANGE_ID" \
              --output "$RUNNER_TEMP/completion/$evidence_asset"
            "$RUNNER_TEMP/process-authority/bin/python" processctl.py \
              evidence validate-bootstrap "$RUNNER_TEMP/completion/$evidence_asset"
          fi
          printf 'evidence_asset=%s\n' "$evidence_asset" >> "$GITHUB_OUTPUT"

      - name: Preserve completion evidence before remote publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-completion-${{ inputs.release_head_sha }}
          path: ${{ runner.temp }}/completion/${{ steps.evidence.outputs.evidence_asset }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Create short-lived source publication token
        id: publication-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: engineering-process
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Publish the exact completed source and create the ready PR
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          RELEASE_BRANCH: automation/release/next
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test -z "$remote_sha" || test "$remote_sha" = "$HEAD_SHA"
          version="$(jq -r .version release.json)"
          title="chore(release): prepare v$version"
          processctl publication release-pr-body \
            --state approved --output "$RUNNER_TEMP/release-pr.md"
          processctl publication validate-pr \
            --title "$title" --body-file "$RUNNER_TEMP/release-pr.md" \
            --branch "$RELEASE_BRANCH" --state ready
          "$RUNNER_TEMP/process-authority/bin/python" processctl.py \
            publication validate-source --project-root . \
            --change-id "${{ steps.lifecycle.outputs.change_id }}" \
            --commit "$HEAD_SHA" --title "$title" \
            --branch "$RELEASE_BRANCH" --body-file "$RUNNER_TEMP/release-pr.md"
          processctl publication validate-range \
            --project-root . --branch "$RELEASE_BRANCH" \
            --range "$BASE_SHA..$HEAD_SHA"
          if test -z "$remote_sha"; then
            git push origin "$HEAD_SHA:refs/heads/$RELEASE_BRANCH"
          fi
          existing="$(gh pr list --state open --head "$RELEASE_BRANCH" --json number --jq 'length')"
          test "$existing" = 0
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "$title" --body-file "$RUNNER_TEMP/release-pr.md"
