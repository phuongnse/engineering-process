name: Verify unpublished Release candidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing the unpublished source bundle
        required: true
        type: string
      comparison_base:
        description: Exact protected-main base of the candidate
        required: true
        type: string
      release_head_sha:
        description: Exact unpublished candidate checkpoint
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-${{ inputs.release_head_sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact unpublished checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate bounded candidate identity
        env:
          BASE_SHA: ${{ inputs.comparison_base }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.comparison_base }}

      - name: Restore the unpublished source bundle
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.release_head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download "$SOURCE_RUN_ID" \
            --name "unpublished-release-candidate-$HEAD_SHA" \
            --dir "$RUNNER_TEMP/candidate"
          test "$(jq -r .headSha "$RUNNER_TEMP/candidate/candidate.json")" = "$HEAD_SHA"
          test "$(jq -r .baseSha "$RUNNER_TEMP/candidate/candidate.json")" = "${{ inputs.comparison_base }}"
          git fetch "$RUNNER_TEMP/candidate/source.bundle" "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install the exact public N-1 authority and project dependencies
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            -r engineering_process/requirements-runtime.txt \
            -r engineering_process/requirements-dev.txt \
            -r engineering_process/requirements-build.txt
          printf '%s\n' "$RUNNER_TEMP/process-authority/bin" >> "$GITHUB_PATH"

      - name: Verify and bind the immutable candidate under N-1
        id: identity
        env:
          CONTEXT_ID: release-candidate-${{ inputs.release_head_sha }}
        run: |
          change_id="$(jq -r .id .release/change.json)"
          processctl doctor
          processctl contract validate --kind change .release/change.json
          processctl contract validate --kind plan .release/plan.json
          processctl change start \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --contract .release/change.json
          processctl change plan \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$change_id" --plan .release/plan.json
          processctl change implement \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$change_id"
          processctl change verify \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$change_id" --profile development
          processctl change verify \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$change_id" --profile review
          test "$(processctl change status --change-id "$change_id" --json | jq -r .phase)" = verified
          printf 'change_id=%s\n' "$change_id" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact verified checkpoint and lifecycle
        env:
          CHANGE_ID: ${{ steps.identity.outputs.change_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-candidate/lifecycle"
          cp "$RUNNER_TEMP/candidate/source.bundle" "$RUNNER_TEMP/verified-candidate/source.bundle"
          cp "$RUNNER_TEMP/candidate/candidate.json" "$RUNNER_TEMP/verified-candidate/candidate.json"
          cp -R ".process/runs/$CHANGE_ID/." "$RUNNER_TEMP/verified-candidate/lifecycle/"

      - name: Upload the host-neutral reviewer handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-candidate-${{ inputs.release_head_sha }}
          path: ${{ runner.temp }}/verified-candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true

      - name: Dispatch the immutable checkpoint to the consumer-selected reviewer host
        env:
          CHANGE_ID: ${{ steps.identity.outputs.change_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg artifact "verified-release-candidate-${{ inputs.release_head_sha }}" \
            --arg base "${{ inputs.comparison_base }}" \
            --arg changeId "$CHANGE_ID" \
            --arg commit "${{ inputs.release_head_sha }}" \
            --arg maxCompletionEvidenceBytes "60000" \
            --arg publicationWorkflow "release-approval.yml" \
            --arg completionEvidenceEncoding "gzip+base64" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            '{event_type: "engineering-process-review-required", client_payload: {artifact: $artifact, comparisonBase: $base, changeId: $changeId, commit: $commit, completionEvidenceEncoding: $completionEvidenceEncoding, maxCompletionEvidenceBytes: ($maxCompletionEvidenceBytes | tonumber), publicationWorkflow: $publicationWorkflow, repository: $repository, verifiedRunId: $runId}}' \
            > "$RUNNER_TEMP/review-required-event.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/review-required-event.json"
