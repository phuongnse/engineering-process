name: Release Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: Exact Release PR number created by the Release PR workflow
        required: true
        type: string
      release_head_sha:
        description: Exact Release PR head created by the Release PR workflow
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-candidate-${{ inputs.release_head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact Release PR candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve the dispatched Release PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
          RELEASE_HEAD_SHA: ${{ inputs.release_head_sha }}
        run: |
          printf '%s' "$RELEASE_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$RELEASE_HEAD_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .state)" = open
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .base.ref)" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.ref)" = automation/release/next
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER" --jq .head.sha)" = "$RELEASE_HEAD_SHA"

      - name: Record non-release applicability
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.ref != 'automation/release/next' ||
          github.event.pull_request.head.repo.full_name != github.repository)
        run: echo "Release candidate verification is not applicable to this pull request."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_head_sha || github.event.pull_request.head.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          python-version: "3.14"

      - name: Install the exact public N-1 authority and project dependencies
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          python -m venv "$RUNNER_TEMP/process-authority"
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            --require-hashes -r requirements/process.txt
          "$RUNNER_TEMP/process-authority/bin/python" -m pip install \
            -r engineering_process/requirements-runtime.txt \
            -r engineering_process/requirements-dev.txt \
            -r engineering_process/requirements-build.txt
          printf '%s\n' "$RUNNER_TEMP/process-authority/bin" >> "$GITHUB_PATH"

      - name: Resolve the generated lifecycle identity
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        id: identity
        run: |
          change_id="$(python -c 'import json; print(json.load(open(".release/change.json", encoding="utf-8"))["id"])')"
          printf 'change_id=%s\n' "$change_id" >> "$GITHUB_OUTPUT"

      - name: Verify and bind the immutable candidate under N-1
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CHANGE_ID: ${{ steps.identity.outputs.change_id }}
          CONTEXT_ID: release-pr-${{ inputs.release_pr_number || github.event.pull_request.number }}-${{ inputs.release_head_sha || github.event.pull_request.head.sha }}
        run: |
          processctl doctor
          processctl contract validate --kind change .release/change.json
          processctl contract validate --kind plan .release/plan.json
          processctl change start \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --contract .release/change.json
          processctl change plan \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID" --plan .release/plan.json
          processctl change implement \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID"
          processctl change verify \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID" --profile development
          processctl change verify \
            --actor github-release-bot --context "$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID" --profile review
          processctl change review start \
            --actor renovate-ops-independent-reviewer --context "review-$CONTEXT_ID" --actor-kind agent \
            --change-id "$CHANGE_ID" --method isolated-context \
            --attested-by renovate-ops-f22b05f7813d5868f2a728f203a59afa5d6f18d2 \
            --attestation-evidence "github://phuongnse/renovate-ops/commit/f22b05f7813d5868f2a728f203a59afa5d6f18d2"

      - name: Preserve the exact review-pending lifecycle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.head.ref == 'automation/release/next' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ inputs.release_head_sha || github.event.pull_request.head.sha }}
          path: .process/runs/${{ steps.identity.outputs.change_id }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true
