name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final SemVer derived from release change fragments
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engineering-process-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"
      - name: Install release preparation dependency
        run: python -m pip install -r engineering_process/requirements-runtime.txt
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import os,re;
          value=os.environ['RELEASE_VERSION'];
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', value),
          'version must be final SemVer'"
      - name: Materialize release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python verification/prepare_release.py "$RELEASE_VERSION"
      - name: Create or refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch="automation/release/v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add engineering_process/__init__.py pyproject.toml release.json release-changes RELEASE_NOTES.md
          git commit -m "chore(release): prepare v$RELEASE_VERSION"
          desired_title="chore(release): v$RELEASE_VERSION"
          expected_head="$(git rev-parse HEAD)"
          expected_base="$(git rev-parse main)"
          python processctl.py publication validate-branch \
            --branch "$branch" \
            --json
          python processctl.py publication validate-commit \
            --subject "$(git log -1 --format=%s)" \
            --json
          python processctl.py publication validate-range \
            --branch "$branch" \
            --range "main..HEAD" \
            --json
          python processctl.py publication validate-pr \
            --title "$desired_title" \
            --branch "$branch" \
            --state draft \
            --body-file .github/release-pr-body.md \
            --json
          validate_pr_binding() {
            local metadata="$1"
            local required_head_oid="${2:-}"
            local base_ref base_oid head_ref head_oid
            base_ref="$(jq -r '.baseRefName // ""' <<<"$metadata")"
            base_oid="$(jq -r '.baseRefOid // ""' <<<"$metadata")"
            head_ref="$(jq -r '.headRefName // ""' <<<"$metadata")"
            head_oid="$(jq -r '.headRefOid // ""' <<<"$metadata")"
            if [ "$base_ref" != "main" ] || [ "$base_oid" != "$expected_base" ] || [ "$head_ref" != "$branch" ] || \
              { [ -n "$required_head_oid" ] && [ "$head_oid" != "$required_head_oid" ]; }; then
              echo "release PR does not bind the prepared base/head: base=$base_ref@$base_oid head=$head_ref@$head_oid" >&2
              return 1
            fi
          }
          metadata_changed() {
            local metadata="$1"
            local title="$2"
            local body_path="$3"
            local current_title current_body_file
            current_title="$(jq -r '.title // ""' <<<"$metadata")"
            current_body_file="$(mktemp)"
            jq -j '.body // ""' <<<"$metadata" > "$current_body_file"
            if [ "$current_title" = "$title" ] && cmp -s "$body_path" "$current_body_file"; then
              rm -f "$current_body_file"
              return 1
            fi
            rm -f "$current_body_file"
            return 0
          }
          existing_pr="$(gh pr list --head "$branch" --state open --limit 1 --json number,isDraft)"
          pr_number="$(jq -r '.[0].number // empty' <<<"$existing_pr")"
          is_draft="$(jq -r '.[0].isDraft // empty' <<<"$existing_pr")"
          edit_metadata=true
          if [ -n "$pr_number" ]; then
            current_pr="$(gh pr view "$pr_number" --json title,body,baseRefName,baseRefOid,headRefName,headRefOid)"
            validate_pr_binding "$current_pr"
            if ! metadata_changed "$current_pr" "$desired_title" .github/release-pr-body.md; then
              edit_metadata=false
            fi
          fi
          if [ -n "$pr_number" ] && [ "$is_draft" != "true" ]; then
            gh pr ready "$pr_number" --undo
          fi
          if [ -n "$pr_number" ] && [ "$edit_metadata" = true ]; then
            # GITHUB_TOKEN-authored edited events do not start a new workflow run.
            # Apply the canonical metadata before the synchronize event from the
            # new head push so that one normal full run observes the repaired PR.
            gh pr edit "$pr_number" \
              --title "$desired_title" \
              --body-file .github/release-pr-body.md
          fi
          git push --force-with-lease origin "$branch"
          if [ -n "$pr_number" ]; then
            refreshed_pr="$(gh pr view "$pr_number" --json baseRefName,baseRefOid,headRefName,headRefOid)"
            validate_pr_binding "$refreshed_pr" "$expected_head"
          else
            created_pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "$desired_title" \
              --draft \
              --body-file .github/release-pr-body.md)"
            created_pr="$(gh pr view "$created_pr_url" --json baseRefName,baseRefOid,headRefName,headRefOid)"
            validate_pr_binding "$created_pr" "$expected_head"
          fi
