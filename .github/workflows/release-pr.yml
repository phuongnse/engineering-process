name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final SemVer derived from release change fragments
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engineering-process-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.7"
      - name: Install release preparation dependency
        run: python -m pip install -r engineering_process/requirements-runtime.txt
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import os,re;
          value=os.environ['RELEASE_VERSION'];
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', value),
          'version must be final SemVer'"
      - name: Materialize release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python verification/prepare_release.py "$RELEASE_VERSION"
      - name: Create or refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch="automation/release/v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add engineering_process/__init__.py pyproject.toml release.json release-changes
          git commit -m "chore(release): prepare v$RELEASE_VERSION"
          existing_pr="$(gh pr list --head "$branch" --state open --limit 1 --json number,isDraft)"
          pr_number="$(jq -r '.[0].number // empty' <<<"$existing_pr")"
          is_draft="$(jq -r '.[0].isDraft // empty' <<<"$existing_pr")"
          if [ -n "$pr_number" ] && [ "$is_draft" != "true" ]; then
            gh pr ready "$pr_number" --undo
          fi
          git push --force-with-lease origin "$branch"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(release): v$RELEASE_VERSION" \
              --body-file .github/release-pr-body.md
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): v$RELEASE_VERSION" \
              --draft \
              --body-file .github/release-pr-body.md
          fi
