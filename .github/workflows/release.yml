name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: write

concurrency:
  group: engineering-process-governed-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact merged Release PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish_required: ${{ steps.draft.outputs.publish_required }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install exact release validation dependencies
        run: >-
          python -m pip install
          -r engineering_process/requirements-runtime.txt
          -r engineering_process/requirements-dev.txt
          -r engineering_process/requirements-build.txt

      - name: Resolve immutable release identities
        id: identity
        run: |
          mode="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["provenance"]["mode"])')"
          tag="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["identity"]["tag"])')"
          evidence_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print(release["identity"]["receiptAsset"] or release["identity"]["authorizationAsset"])')"
          {
            printf 'mode=%s\n' "$mode"
            printf 'tag=%s\n' "$tag"
            printf 'evidence_asset=%s\n' "$evidence_asset"
          } >> "$GITHUB_OUTPUT"

      - name: Restore exact-head release authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/status" \
            --jq '.statuses | map(select(.context == "release-authorization")) | sort_by(.created_at) | last | .state // empty')"
          test "$status" = success
          artifact_name="release-authorization-$REVIEWED_SHA"
          run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')"
          test -n "$run_id"
          mkdir -p "$RUNNER_TEMP/release-authorization"
          gh run download "$run_id" --name "$artifact_name" \
            --dir "$RUNNER_TEMP/release-authorization"
          test -f "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"

      - name: Prove reviewed tree, merge commit, release contract, and prior tag
        env:
          MODE: ${{ steps.identity.outputs.mode }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          evidence_args=(--reviewed-commit "$REVIEWED_SHA")
          if test "$MODE" = governed; then
            python processctl.py evidence validate \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            evidence_args+=(--receipt "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET")
          else
            python processctl.py evidence validate-bootstrap \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            evidence_args+=(--authorization "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET")
          fi
          python processctl.py publication authorize-release \
            --tag "$TAG" --release-name "$TAG" --commit "$RELEASE_SHA" \
            --main-ref origin/main "${evidence_args[@]}"

      - name: Create or verify the immutable tag
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          existing="$(git rev-list -n 1 "$TAG" -- 2>/dev/null || true)"
          if test -n "$existing"; then
            test "$existing" = "$RELEASE_SHA"
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify the exact draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
        run: |
          evidence_path="$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          {
            printf '%s\n' "$EVIDENCE_ASSET"
            python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"])); print("\n".join(release["identity"]["artifacts"]))'
          } | LC_ALL=C sort > "$expected_assets"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json name --jq .name)" = "$TAG"
            if test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false; then
              gh release verify "$TAG"
              gh release view "$TAG" --json assets --jq '.assets[].name' \
                | LC_ALL=C sort > "$RUNNER_TEMP/published-release-assets.txt"
              cmp "$expected_assets" "$RUNNER_TEMP/published-release-assets.txt"
              mkdir -p "$RUNNER_TEMP/published-evidence"
              gh release download "$TAG" --pattern "$EVIDENCE_ASSET" \
                --dir "$RUNNER_TEMP/published-evidence"
              cmp "$evidence_path" "$RUNNER_TEMP/published-evidence/$EVIDENCE_ASSET"
              printf 'publish_required=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/current-release-assets.txt"
          while IFS= read -r asset; do
            grep -Fx "$asset" "$expected_assets" >/dev/null
          done < "$RUNNER_TEMP/current-release-assets.txt"
          if grep -Fx "$EVIDENCE_ASSET" "$RUNNER_TEMP/current-release-assets.txt" >/dev/null; then
            mkdir -p "$RUNNER_TEMP/existing-evidence"
            gh release download "$TAG" --pattern "$EVIDENCE_ASSET" \
              --dir "$RUNNER_TEMP/existing-evidence"
            cmp "$evidence_path" "$RUNNER_TEMP/existing-evidence/$EVIDENCE_ASSET"
          else
            gh release upload "$TAG" "$evidence_path"
          fi
          printf 'publish_required=true\n' >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare exact immutable assets
    needs: authorize
    if: needs.authorize.outputs.publish_required == 'true'
    uses: ./.github/workflows/prepare-release.yml
    with:
      tag: ${{ needs.authorize.outputs.tag }}
    permissions:
      contents: write

  publish:
    name: Publish immutable GitHub Release
    needs: [authorize, prepare]
    if: needs.authorize.outputs.publish_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the fully prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$TAG" --json name --jq .name)" = "$TAG"
          gh release edit "$TAG" --draft=false
