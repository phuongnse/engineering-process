name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/prepare-release.yml"
      - ".github/workflows/publish.yml"
      - "verification/check_pypi_publication.py"
      - "verification/validate_publish_event.py"
      - "verification/verify_distribution.py"
      - "verification/verify_installed_distribution.py"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: engineering-process-governed-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact merged Release PR
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish_required: ${{ steps.draft.outputs.publish_required }}
      release_sha: ${{ steps.release-pr.outputs.release_sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve the exact merged Release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if test -z "$pr_number"; then
            owner="${GITHUB_REPOSITORY%%/*}"
            gh api \
              "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:automation/release/next&base=main&sort=updated&direction=desc&per_page=20" \
              > "$RUNNER_TEMP/release-pulls.json"
            pr_number="$(jq -r 'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .number // empty' "$RUNNER_TEMP/release-pulls.json")"
          fi
          printf '%s' "$pr_number" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
            > "$RUNNER_TEMP/release-pr.json"
          test "$(jq -r .merged "$RUNNER_TEMP/release-pr.json")" = true
          test "$(jq -r .base.ref "$RUNNER_TEMP/release-pr.json")" = main
          test "$(jq -r .head.ref "$RUNNER_TEMP/release-pr.json")" = automation/release/next
          test "$(jq -r .head.repo.full_name "$RUNNER_TEMP/release-pr.json")" = "$GITHUB_REPOSITORY"
          reviewed_sha="$(jq -r .head.sha "$RUNNER_TEMP/release-pr.json")"
          release_sha="$(jq -r .merge_commit_sha "$RUNNER_TEMP/release-pr.json")"
          printf '%s' "$reviewed_sha" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$release_sha" | grep -Eq '^[0-9a-f]{40}$'
          {
            printf 'pr_number=%s\n' "$pr_number"
            printf 'reviewed_sha=%s\n' "$reviewed_sha"
            printf 'release_sha=%s\n' "$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create short-lived release publication token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: engineering-process
          permission-contents: write
          permission-metadata: read
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ steps.release-pr.outputs.release_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out the base-controlled release validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-controller

      - name: Keep controller code outside the release source fingerprint
        run: printf '/.release-controller/\n' >> .git/info/exclude

      - name: Fetch and bind the immutable reviewed head
        env:
          PR_NUMBER: ${{ steps.release-pr.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.release-pr.outputs.reviewed_sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          git cat-file -e "$REVIEWED_SHA^{commit}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install exact release validation dependencies
        run: >-
          python -m pip install
          -r .release-controller/engineering_process/requirements-runtime.txt
          -r .release-controller/engineering_process/requirements-dev.txt
          -r .release-controller/engineering_process/requirements-build.txt

      - name: Resolve immutable release identities
        id: identity
        run: |
          mode="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["provenance"]["mode"])')"
          tag="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["identity"]["tag"])')"
          evidence_asset="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print(release["identity"]["receiptAsset"] or release["identity"]["authorizationAsset"])')"
          {
            printf 'mode=%s\n' "$mode"
            printf 'tag=%s\n' "$tag"
            printf 'evidence_asset=%s\n' "$evidence_asset"
          } >> "$GITHUB_OUTPUT"

      - name: Restore exact-head release authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ steps.release-pr.outputs.reviewed_sha }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/status" \
            --jq '.statuses | map(select(.context == "release-authorization")) | sort_by(.created_at) | last | .state // empty')"
          test "$status" = success
          artifact_name="release-authorization-$REVIEWED_SHA"
          run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')"
          test -n "$run_id"
          mkdir -p "$RUNNER_TEMP/release-authorization"
          gh run download "$run_id" --name "$artifact_name" \
            --dir "$RUNNER_TEMP/release-authorization"
          test -f "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"

      - name: Prove reviewed tree, merge commit, release contract, and prior tag
        env:
          MODE: ${{ steps.identity.outputs.mode }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
          REVIEWED_SHA: ${{ steps.release-pr.outputs.reviewed_sha }}
          RELEASE_SHA: ${{ steps.release-pr.outputs.release_sha }}
        run: |
          controller=(python "$GITHUB_WORKSPACE/.release-controller/processctl.py")
          evidence_args=(--reviewed-commit "$REVIEWED_SHA")
          if test "$MODE" = governed; then
            "${controller[@]}" evidence validate \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            evidence_args+=(--receipt "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET")
          else
            "${controller[@]}" evidence validate-bootstrap \
              "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
            evidence_args+=(--authorization "$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET")
          fi
          "${controller[@]}" publication authorize-release \
            --project-root "$GITHUB_WORKSPACE" \
            --tag "$TAG" --release-name "$TAG" --commit "$RELEASE_SHA" \
            --main-ref origin/main "${evidence_args[@]}"

      - name: Create or verify the immutable tag
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_SHA: ${{ steps.release-pr.outputs.release_sha }}
        run: |
          existing="$(git rev-list -n 1 "$TAG" -- 2>/dev/null || true)"
          if test -n "$existing"; then
            test "$existing" = "$RELEASE_SHA"
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify the exact draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          EVIDENCE_ASSET: ${{ steps.identity.outputs.evidence_asset }}
        run: |
          evidence_path="$RUNNER_TEMP/release-authorization/$EVIDENCE_ASSET"
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          {
            printf '%s\n' "$EVIDENCE_ASSET"
            python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"])); print("\n".join(release["identity"]["artifacts"]))'
          } | LC_ALL=C sort > "$expected_assets"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json name --jq .name)" = "$TAG"
            if test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false; then
              gh release verify "$TAG"
              gh release view "$TAG" --json assets --jq '.assets[].name' \
                | LC_ALL=C sort > "$RUNNER_TEMP/published-release-assets.txt"
              cmp "$expected_assets" "$RUNNER_TEMP/published-release-assets.txt"
              mkdir -p "$RUNNER_TEMP/published-evidence"
              gh release download "$TAG" --pattern "$EVIDENCE_ASSET" \
                --dir "$RUNNER_TEMP/published-evidence"
              cmp "$evidence_path" "$RUNNER_TEMP/published-evidence/$EVIDENCE_ASSET"
              printf 'publish_required=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/current-release-assets.txt"
          while IFS= read -r asset; do
            grep -Fx "$asset" "$expected_assets" >/dev/null
          done < "$RUNNER_TEMP/current-release-assets.txt"
          if grep -Fx "$EVIDENCE_ASSET" "$RUNNER_TEMP/current-release-assets.txt" >/dev/null; then
            mkdir -p "$RUNNER_TEMP/existing-evidence"
            gh release download "$TAG" --pattern "$EVIDENCE_ASSET" \
              --dir "$RUNNER_TEMP/existing-evidence"
            cmp "$evidence_path" "$RUNNER_TEMP/existing-evidence/$EVIDENCE_ASSET"
          else
            gh release upload "$TAG" "$evidence_path"
          fi
          printf 'publish_required=true\n' >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare exact immutable assets
    needs: authorize
    if: needs.authorize.outputs.publish_required == 'true'
    uses: ./.github/workflows/prepare-release.yml
    with:
      tag: ${{ needs.authorize.outputs.tag }}
    permissions:
      contents: write

  publish:
    name: Publish immutable GitHub Release
    needs: [authorize, prepare]
    if: needs.authorize.outputs.publish_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the fully prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$TAG" --json name --jq .name)" = "$TAG"
          gh release edit "$TAG" --draft=false

  dispatch-pypi:
    name: Dispatch exact PyPI publication
    needs: [authorize, prepare, publish]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      ((needs.authorize.outputs.publish_required == 'true' &&
      needs.prepare.result == 'success' &&
      needs.publish.result == 'success') ||
      (needs.authorize.outputs.publish_required == 'false' &&
      needs.prepare.result == 'skipped' &&
      needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.tag }}

      - name: Resolve exact publication event identity
        id: identity
        env:
          EXPECTED_CHECKPOINT: ${{ needs.authorize.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_CHECKPOINT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release verify "$RELEASE_TAG"
          version="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          test "$RELEASE_TAG" = "v$version"
          attestation="$(python -c 'import json; release=json.load(open("release.json", encoding="utf-8")); print("{}-{}-artifacts.json".format(release["identity"]["package"], release["identity"]["tag"]))')"
          digest="$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"$attestation\") | .digest")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          {
            printf 'attestation_digest=%s\n' "$digest"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create short-lived publication event token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: engineering-process
          permission-contents: write
          permission-metadata: read

      - name: Dispatch authenticated publication event
        env:
          ATTESTATION_DIGEST: ${{ steps.identity.outputs.attestation_digest }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          jq -n \
            --arg attestationDigest "$ATTESTATION_DIGEST" \
            --arg commit "$RELEASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" \
            '{event_type: "engineering-process-release-ready", client_payload: {attestationDigest: $attestationDigest, commit: $commit, repository: $repository, tag: $tag, version: $version}}' \
            > "$RUNNER_TEMP/publication-event.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/publication-event.json"
