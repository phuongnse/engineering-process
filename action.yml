name: Install engineering-process runtime
description: Install one exact hash-locked engineering-process authority with bounded public-index propagation retries.

inputs:
  project-root:
    description: Consumer repository root containing the requirements lock.
    required: false
    default: .
  requirements-lock:
    description: Hash-locked requirements file inside project-root.
    required: false
    default: requirements/process.txt
  python-executable:
    description: Optional existing Python executable into which the authority is installed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install exact public process authority
      shell: python
      env:
        ENGINEERING_PROCESS_ACTION_PATH: ${{ github.action_path }}
        ENGINEERING_PROCESS_PROJECT_ROOT: ${{ inputs.project-root }}
        ENGINEERING_PROCESS_REQUIREMENTS_LOCK: ${{ inputs.requirements-lock }}
        ENGINEERING_PROCESS_PYTHON: ${{ inputs.python-executable }}
      run: |
        import os
        from pathlib import Path
        import runpy
        import sys

        action_root = Path(os.environ["ENGINEERING_PROCESS_ACTION_PATH"]).resolve(strict=True)
        installer = action_root / "verification" / "install_process_runtime.py"
        arguments = [
            str(installer),
            "--project-root",
            os.environ["ENGINEERING_PROCESS_PROJECT_ROOT"],
            "--requirements-lock",
            os.environ["ENGINEERING_PROCESS_REQUIREMENTS_LOCK"],
        ]
        if python := os.environ["ENGINEERING_PROCESS_PYTHON"]:
            arguments.extend(("--python", python))
        sys.argv = arguments
        runpy.run_path(installer, run_name="__main__")

branding:
  icon: shield
  color: blue
