[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-process"
version = "2.2.0"
description = "A small agent-neutral engineering lifecycle with managed adoption"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/phuongnse/engineering-process"
Issues = "https://github.com/phuongnse/engineering-process/issues"
Repository = "https://github.com/phuongnse/engineering-process.git"

[project.scripts]
processctl = "engineering_process.cli:main"

[tool.setuptools.packages.find]
include = ["engineering_process*"]

[tool.setuptools.dynamic]
dependencies = {file = ["engineering_process/requirements-runtime.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["engineering_process/requirements-dev.txt"]}

[tool.setuptools.data-files]
"share/engineering-process" = ["process-graph.json"]
"share/engineering-process/process_assets/standards" = [
  "process_assets/standards/automation-name.v1.json",
  "process_assets/standards/issue.v1.json",
  "process_assets/standards/pull-request.v1.json",
  "process_assets/standards/release-notes.v1.json",
]
"share/engineering-process/templates" = [
  "templates/AGENTS.process.md",
  "templates/PULL_REQUEST_TEMPLATE.md",
  "templates/renovate.json",
  "templates/adopt-process.py",
  "templates/adopt-process-windows-job.py",
]
"share/engineering-process/schemas" = [
  "schemas/artifact-selection.schema.json",
  "schemas/artifact-standard.schema.json",
  "schemas/automation-name-data.schema.json",
  "schemas/issue-data.schema.json",
  "schemas/change.schema.json",
  "schemas/plan.schema.json",
  "schemas/process-graph.schema.json",
  "schemas/process-lock.schema.json",
  "schemas/production-engineering.schema.json",
  "schemas/pr-description-data.schema.json",
  "schemas/project-legacy.schema.json",
  "schemas/project.schema.json",
  "schemas/receipt.schema.json",
  "schemas/release-change.schema.json",
  "schemas/release.schema.json",
  "schemas/release-notes-data.schema.json",
  "schemas/renovate-preset.schema.json",
  "schemas/review.schema.json",
  "schemas/run.schema.json",
]
"share/engineering-process/skills/change-complete" = ["process_assets/skills/change-complete/SKILL.md"]
"share/engineering-process/skills/change-implement" = ["process_assets/skills/change-implement/SKILL.md"]
"share/engineering-process/skills/change-plan" = ["process_assets/skills/change-plan/SKILL.md"]
"share/engineering-process/skills/change-review" = ["process_assets/skills/change-review/SKILL.md"]
"share/engineering-process/skills/change-start" = ["process_assets/skills/change-start/SKILL.md"]
"share/engineering-process/skills/change-verify" = ["process_assets/skills/change-verify/SKILL.md"]
"share/engineering-process/skills/deliver-change" = ["process_assets/skills/deliver-change/SKILL.md"]
"share/engineering-process/skills/process-improve" = ["process_assets/skills/process-improve/SKILL.md"]
"share/engineering-process/skills/production-engineering" = [
  "process_assets/skills/production-engineering/SKILL.md",
  "process_assets/skills/production-engineering/invariants.json",
]
