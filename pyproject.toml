[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-process"
version = "0.8.0"
description = "Agent-neutral end-to-end engineering lifecycle and deterministic process CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/phuongnse/engineering-process"
Issues = "https://github.com/phuongnse/engineering-process/issues"
Repository = "https://github.com/phuongnse/engineering-process.git"

[project.scripts]
processctl = "engineering_process.cli:main"

[tool.setuptools.packages.find]
include = ["engineering_process*"]

[tool.setuptools.dynamic]
dependencies = {file = ["engineering_process/requirements-runtime.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["engineering_process/requirements-dev.txt"]}

[tool.setuptools.package-data]
engineering_process = ["requirements-*.txt"]

[tool.setuptools.data-files]
"share/engineering-process" = ["bundles.json", "improvement-catalog.json", "process-graph.json", "release.json", "PRODUCTION_STANDARD.md", "PROCESS_IMPROVEMENT.md", "VERSIONING.md"]
