[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-process"
version = "0.1.0"
description = "Agent-neutral end-to-end engineering lifecycle and deterministic process CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/phuongnse/engineering-process"
Issues = "https://github.com/phuongnse/engineering-process/issues"
Repository = "https://github.com/phuongnse/engineering-process.git"

[project.scripts]
processctl = "engineering_process.cli:main"

[tool.setuptools.packages.find]
include = ["engineering_process*"]

[tool.setuptools.dynamic]
dependencies = {file = ["engineering_process/requirements-runtime.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["engineering_process/requirements-dev.txt"]}

[tool.setuptools.package-data]
engineering_process = ["requirements-*.txt"]

[tool.setuptools.data-files]
"share/engineering-process" = ["bundles.json"]
"share/engineering-process/templates" = [
  "templates/AGENTS.process.md",
  "templates/PULL_REQUEST_TEMPLATE.md",
]
"share/engineering-process/schemas" = [
  "schemas/change.schema.json",
  "schemas/lifecycle.schema.json",
  "schemas/plan.schema.json",
  "schemas/process-lock.schema.json",
  "schemas/project.schema.json",
  "schemas/review.schema.json",
  "schemas/reviewer-attestation.schema.json",
  "schemas/verification.schema.json",
]
"share/engineering-process/examples" = [
  "examples/change.json",
